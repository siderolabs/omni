# The main test: external etcd, and the machine API served over TLS with a certificate signed by the test CA, with Omni
# given that CA, so that machines booting from media generated by Omni can connect to it only if Omni delivered the CA to them.
# Helm replaces lists instead of merging them, so the volumes repeat the trusted roots ones of the base values.
config:
  trustedRootsFile: /etc/ssl/certs/omni-trusted-roots.pem
  services:
    machineAPI:
      advertisedURL: https://${NODE_IP}:30090
      certFile: /etc/omni/machine-api-tls/tls.crt
      keyFile: /etc/omni/machine-api-tls/tls.key
  storage:
    default:
      etcd:
        embedded: false
        endpoints:
          - https://etcd.etcd.svc.cluster.local:2379
        caFile: /etcd-client-certs/ca.crt
        certFile: /etcd-client-certs/client.crt
        keyFile: /etcd-client-certs/client.key

extraVolumes:
  - name: etcd-client-certs
    secret:
      secretName: etcd-client-certs
  - name: trusted-roots
    secret:
      secretName: omni-trusted-roots
  - name: machine-api-tls
    secret:
      secretName: machine-api-tls

extraVolumeMounts:
  - name: etcd-client-certs
    mountPath: /etcd-client-certs
    readOnly: true
  - name: trusted-roots
    mountPath: /etc/ssl/certs/omni-trusted-roots.pem
    subPath: ca.crt
    readOnly: true
  - name: machine-api-tls
    mountPath: /etc/omni/machine-api-tls
    readOnly: true
