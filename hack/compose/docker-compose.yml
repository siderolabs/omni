services:
  omni:
    network_mode: host
    devices:
      - /dev/net/tun
    depends_on:
      vault-dev:
        condition: service_started
      node-dev:
        condition: service_started
      seaweedfs-bucket:
        condition: service_started
      runtime-tools-init:
        condition: service_completed_successfully
    volumes:
      - etcd:/_out/etcd
      - logs:/_out/logs
      - secondary-storage:/_out/secondary-storage
      - etcd-backup:/tmp/omni-data/etcd-backup
      - audit-logs:/tmp/omni-data/audit-logs
      - ../generate-certs/certs:/etc/ssl/omni-certs:ro
      - dlv-tools:/debug:ro
    container_name: local-omni
    restart: on-failure
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    entrypoint:
      - /debug/launcher
    build:
      context: ../../
      dockerfile: Dockerfile
      args:
        - ARTIFACTS=${ARTIFACTS:?error}
        - SHA=${SHA:?error}
        - TAG=${TAG:?error}
        - USERNAME=${USERNAME:?error}
        - REGISTRY=${REGISTRY:?error}
        - JS_TOOLCHAIN=${JS_TOOLCHAIN:?error}
        - PROTOBUF_GRPC_GATEWAY_TS_VERSION=${PROTOBUF_GRPC_GATEWAY_TS_VERSION:?error}
        - NODE_BUILD_ARGS=${NODE_BUILD_ARGS}
        - TOOLCHAIN=${TOOLCHAIN:?error}
        - CGO_ENABLED=${CGO_ENABLED:?error}
        - GO_BUILDFLAGS=${GO_BUILDFLAGS}
        - GOLANGCILINT_VERSION=${GOLANGCILINT_VERSION:?error}
        - GOFUMPT_VERSION=${GOFUMPT_VERSION:?error}
        - GOIMPORTS_VERSION=${GOIMPORTS_VERSION:?error}
        - GOMOCK_VERSION=${GOMOCK_VERSION:?error}
        - PROTOBUF_GO_VERSION=${PROTOBUF_GO_VERSION:?error}
        - GRPC_GO_VERSION=${GRPC_GO_VERSION:?error}
        - GRPC_GATEWAY_VERSION=${GRPC_GATEWAY_VERSION:?error}
        - VTPROTOBUF_VERSION=${VTPROTOBUF_VERSION:?error}
        - DEEPCOPY_VERSION=${DEEPCOPY_VERSION:?error}
        - DIS_VULNCHECK_VERSION=${DIS_VULNCHECK_VERSION:?error}
        - TESTPKGS=${TESTPKGS:?error}
        - GO_LDFLAGS=${GO_LDFLAGS}
        - GOEXPERIMENT=${GOEXPERIMENT}
        # Controls build-time debug flags.
        - WITH_DEBUG=${WITH_DEBUG:-false}
        - GOTOOLCHAIN=${GOTOOLCHAIN}
        - SYFT_VERSION=${SYFT_VERSION:?error}
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
      - VAULT_TOKEN=dev-o-token
      - SIDEROLINK_DEV_JOIN_TOKEN=w7uVuW3zbVKIYQuzEcyetAHeYMeo5q2L9RvkAVfCfSCD
      # Controls runtime debug flags.
      - WITH_DEBUG=${WITH_DEBUG:-false}
      - DELVE_LISTEN_ADDR=${DELVE_LISTEN_ADDR:-0.0.0.0:12345}
      - OMNI_BIN=${OMNI_BIN:-/omni}
    command: >-
      --sqlite-storage-path=/_out/secondary-storage/sqlite.db

  # The launcher is needed regardless of WITH_DEBUG.
  runtime-tools-init:
    image: ${TOOLCHAIN}
    restart: on-failure
    volumes:
      - dlv-tools:/output
      - ./launcher:/launcher:ro
    command:
      - sh
      - -c
      - |
        cd /launcher && CGO_ENABLED=0 GOOS=linux GO111MODULE=off go build -o /output/launcher .
        # Install Delve
        case '${WITH_DEBUG:-false}' in
          true|1)
            test -f /output/dlv || \
              (CGO_ENABLED=0 go install github.com/go-delve/delve/cmd/dlv@v1.27.1 && cp /go/bin/dlv /output/)
            ;;
        esac

  vault-dev:
    container_name: local-vault
    image: hashicorp/vault:1.18
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=dev-o-token
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:8200:8200"

  vault-startup:
    depends_on:
      - vault-dev
    restart: on-failure
    container_name: local-vault-init
    image: hashicorp/vault:1.18
    volumes:
      - ../../internal/backend/runtime/omni/testdata/pgp/new_key.private:/tmp/key.private:ro
    environment:
      - VAULT_ADDR=http://vault-dev:8200
      - VAULT_TOKEN=dev-o-token
    entrypoint: >-
      vault kv put
      -mount=secret
      omni-private-key
      private-key=@/tmp/key.private
      || sleep 15 && exit 1

  node-dev:
    network_mode: host
    container_name: local-node
    image: ${JS_TOOLCHAIN}
    volumes:
      - ../../frontend:/app:rw
    working_dir: /app
    command: sh -c 'npm i && npm run serve'
    stop_signal: SIGKILL

  # SeaweedFS serves S3 on 8333, published on 9000, which is the endpoint the tests are
  # configured with. The credentials come from a config file: without one it serves anonymously.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: seaweedfs
    volumes:
      - seaweedfs:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:9000:8333"
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json

  prometheus:
    network_mode: host
    image: prom/prometheus
    depends_on:
      - omni
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  # Creates the bucket the etcd backup tests write to. Creating one that already exists succeeds,
  # so this is a no-op once the seaweedfs volume has been through a down/up.
  #
  # weed shell waits for the master rather than failing fast, so bound it and let the restart
  # policy come back around if the master is not up yet.
  seaweedfs-bucket:
    image: chrislusf/seaweedfs:4.47
    container_name: seaweedfs-bucket
    depends_on:
      - seaweedfs
    entrypoint: /bin/sh
    restart: on-failure
    command: -c "echo 's3.bucket.create -name mybucket' | timeout 60 weed shell -master=seaweedfs:9333"

  omni-inspector:
    image: ghcr.io/siderolabs/omni-inspector:latest
    container_name: omni-inspector
    depends_on:
      - omni
    network_mode: host
    restart: on-failure
    command: >-
      --omni-debug=${WITH_DEBUG:-false}

  grafana:
    network_mode: host
    image: grafana/grafana:latest
    restart: on-failure
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana

volumes:
  etcd:
  logs:
  seaweedfs:
  secondary-storage:
  etcd-backup:
  audit-logs:
  grafana_data:
  dlv-tools:
