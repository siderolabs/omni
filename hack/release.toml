# commit to be tagged for the new release
commit = "HEAD"

project_name = "Omni"
github_repo = "siderolabs/omni"
match_deps = "^github.com/((talos-systems|siderolabs)/[a-zA-Z0-9-]+)$"

pre_release = true
previous = "v1.14.0"

[notes.locked-dry-run]
title = "Dry Run of Locked Clusters and Machines"
description = """\
While a cluster or a machine is locked, Omni now checks the pending config of each machine with a Talos dry run, without \
applying it. The result is stored in the `DryRunStatus` resource: whether Talos would accept the config, \
the errors Talos would reject the config with, and whether the machine would reboot on unlock (Talos below 1.14 only).

Locked clusters and machines start getting these dry runs after the upgrade. A dry run never applies the config.
"""
