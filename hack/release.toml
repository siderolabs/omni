# commit to be tagged for the new release
commit = "HEAD"

project_name = "Omni"
github_repo = "siderolabs/omni"
match_deps = "^github.com/((talos-systems|siderolabs)/[a-zA-Z0-9-]+)$"

pre_release = true
previous = "v1.12.0"

[notes.aaa-boltdb-deprecation]
title = "Urgent Upgrade Notes **(No, really, you MUST read this before you upgrade)**"
description = """\
The BoltDB storage backend (`storage.default.kind: boltdb`, `--storage-kind boltdb`) is deprecated and will be removed in a \
future release. It keeps working in this release and Omni logs a warning at startup when it runs on it. There is no automated \
migration between the two backends, so if your Omni runs on BoltDB, plan the move to etcd, which is the default, before \
the removal lands.

The metrics endpoint now listens on `127.0.0.1:2122` by default instead of `0.0.0.0:2122`. If you scrape the Omni metrics \
from another host or from outside the Omni container (e.g., through a published Docker port), set `services.metrics.endpoint` \
(`--metrics-bind-addr`) to `0.0.0.0:2122` explicitly. The Helm chart still binds it to `0.0.0.0:2122` when `metrics.enabled` is set.

The embedded etcd server no longer listens on any address by default, Omni connects to it in-memory. Previously, it listened \
on `storage.default.etcd.endpoints` (`http://localhost:2379` by default) without TLS, and backups taken with `etcdctl` \
relied on it. To access the embedded etcd from outside, set `storage.default.etcd.embeddedCertFile` and `embeddedKeyFile` \
(`--etcd-embedded-cert-path`, `--etcd-embedded-key-path`), and optionally `embeddedCaFile` (`--etcd-embedded-ca-path`). The \
embedded etcd server then listens on the `storage.default.etcd.endpoints` addresses with TLS, and only accepts clients with a \
certificate signed by the given CA. When no CA is set, the certificate file must contain a single certificate, which is used \
as the CA, so clients can use the same certificate and key.
"""

[notes.eula-acceptance]
title = "EULA Acceptance"
description = """\
The EULA page in the UI is removed. The [End User License Agreement](https://siderolabs.com/eula/) is now accepted with \
the `--eula-accept-name` and `--eula-accept-email` flags (`eulaAccept` in the config file, `config.eulaAccept` in the Helm chart).

Omni does not start until the EULA is accepted. Once accepted, it stays accepted, so a new installation needs the flags \
only on its first start. Setting them again with different values updates the stored name and email. Installations that \
already accepted the EULA need no changes.
"""

[notes.local-resource-service]
title = "Local Resource Service Removal"
description = """\
The local resource service, which served Omni resources on a local listener, is removed. Consumers should reach \
Omni through its regular API with a service account instead. Its `services.localResourceService` settings and \
flags have no effect.
"""

[notes.require-reauth-for-new-keys]
title = "Identity Provider Session Reuse"
description = """\
Every new public key (for the UI, the CLI or the workload proxy) requires a fresh login at the identity provider. \
Setting `auth.requireReauthForNewKeys: false` lets the identity provider reuse its existing session instead, while \
the first login after an Omni logout still requires a fresh one. This lowers security, so only turn it off when the \
identity provider limits how long its sessions last.

With the setting on, Omni logs a warning when an OIDC or SAML identity provider ignores the request for a fresh \
login. Additionally, with OIDC, Omni now only accepts an ID token issued in the last few minutes to confirm a new key.
"""

[notes.install-image]
title = "Install Image in the Machine Configuration"
description = """\
Omni no longer sets `.machine.install.image` in the configuration of machines with Talos installed, nor of the machines it installs \
over the Talos LifecycleService (Talos 1.13 or later), where the install request carries the image. \
Talos reads the field only when it installs from the configuration, and upgrades always get their image from Omni, so it was never used for these machines. \
It looked like the image Talos upgrades with, which it is not. \
Deploying this release removes the field from the configuration of the cluster members, a config update without a reboot.

Config patches can no longer set `machine.install.image`. New patches carrying it are rejected. \
The existing ones keep working, and the field has to be removed the next time such a patch is edited.
"""

[notes.join-config-in-schematic]
title = "SideroLink Join Configuration in the Schematic"
description = """\
Every machine's schematic now carries its SideroLink join configuration, so an install or a Talos upgrade no longer loses the connection to Omni \
when the join args were only on the machine's kernel command line. From Talos 1.12 on, the join configuration is embedded machine configuration \
instead of kernel args, also in new installation media. Existing machines move to the new schematic at their next install or upgrade. \
Deploying this release does not install, upgrade or reboot any machine.

If you give Talos 1.12+ machines their configuration through another source, such as cloud user-data, the `talos.config` URL, \
or the `talos.config.early` and `talos.config.inline` kernel args, include the join documents in it (`omnictl jointoken machine-config` prints them), \
since that configuration replaces the embedded one.

The new `omni_machine_siderolink_join_config` metric counts the machines by where their SideroLink join configuration is: `embedded_config`, \
`kernel_args`, `machine_config` or `unknown`. It shows how many machines already have the join configuration in their schematic.
"""

[notes.config-try-mode]
title = "Config Changes Applied in Try Mode"
description = """\
On machines running Talos 1.14 or later, Omni now applies config changes in try mode. It confirms a change only when the machine is still reachable \
after it. When a config patch cuts a machine off from Omni (e.g., incorrect network configuration), Talos rolls it back, and the machine does not \
stay unreachable.

After 2 rolled back attempts, Omni stops and reports the error on the machine. Changing the config starts over. The first config, which takes a \
machine out of maintenance mode, is still applied without try mode.

Errors when applying a config to a machine in maintenance mode are now shown in the machine list and on the machine details page.
"""

[notes.oidc-identity-labels]
title = "OIDC Identity Labels and Roles"
description = """\
OIDC logins now get identity labels, like SAML logins. The `groups` and `roles` claims of the ID token become labels on the identity, e.g., \
`oidc.omni.sidero.dev/groups/devs`. They are synced on every login. The existing `SAMLLabelRule` resources apply to these labels too, so a rule \
assigns a role to an OIDC user the same way it does to a SAML user.

By default, OIDC users are still not created on their first login. To create them like SAML users, set `auth.oidc.autoCreateUsers` \
(`--auth-oidc-auto-create-users`). Only do this when every account of the identity provider belongs to the organization.

The labels are shown in the users list of the UI and in `omnictl user list`.
"""

[notes.saml-request-signing]
title = "Signed SAML Requests"
description = """\
Omni can now sign the SAML `AuthnRequest` and `LogoutRequest`. To enable it, register a certificate at the identity provider, then set \
`auth.saml.certFile` and `auth.saml.keyFile` (`--auth-saml-cert`, `--auth-saml-key`). Omni publishes the certificate in `/saml/metadata`.

The `LogoutRequest` is sent over the HTTP-Redirect binding when the identity provider supports it, and over HTTP-POST otherwise.
"""

[notes.secret-flags-deprecation]
title = "Secrets Through Environment Variables"
description = """\
The OIDC client secret can now be set with the `OMNI_AUTH_OIDC_CLIENT_SECRET` environment variable, like the image factory passwords.

The flags that take a secret as their value are deprecated: `--auth-oidc-client-secret`, `--primary-factory-password`, `--secondary-factory-password` \
and `--image-factory-password`.  Use the environment variables or a config file instead. `--config-path` can be given more than once, and the files are merged.
"""

[notes.audit-log-client-address]
title = "Client Address in Audit Logs"
description = """\
Audit log entries now record the address of the client that made the request. This includes requests to the Kubernetes proxy. The audit log page shows \
the address next to the actor.
"""

[notes.service-account-key-revocation]
title = "Service Account Key Revocation"
description = """\
A single key of a service account can now be revoked, and the service account and its other keys stay. Use \
`omnictl serviceaccount revoke-key <name> <public-key-id>`, or the list of keys on the service accounts page in the UI.
"""

[notes.join-token-labels]
title = "Machine Labels Through Join Tokens"
description = """\
A join token can now carry machine labels, set with `omnictl jointoken machine-config|kernel-args --set-labels key=value`. A machine that joins with \
such a token gets these labels as user labels, so they can be changed later like any other user label. A machine that already has user labels keeps \
them.
"""

[notes.deprecated-talos-maintenance-upgrade]
title = "Upgrades Between Unsupported Talos Versions in Maintenance"
description = """\
A machine in maintenance mode that runs a Talos version Omni no longer supports can now be upgraded to another unsupported version. This way, an old \
machine can go through the intermediate versions Talos requires (e.g., 1.7 to 1.8 to 1.9) until it reaches a supported one.
"""

[notes.default-version-label]
title = "Default Version Label"
description = """\
The `TalosVersion` and `KubernetesVersion` resources that Omni uses as its defaults now carry the `omni.sidero.dev/default-version` label. Clients can \
find the default versions with a label query.
"""

[notes.min-talos-version]
title = "Minimum Talos Version"
description = """\
New clusters now require Talos 1.10.0 or later. The minimum was 1.9.0 before.
"""


[notes.resource-browser]
title = "Resource Browser"
description = """\
The UI has a new resource browser. It lists every Omni and Talos resource the user can read, with search and export, and is meant for debugging.
"""

[notes.ui-design-refresh]
title = "UI Design Refresh and Themes"
description = """\
The UI now uses the fonts and colors of the Talos design system. Each status has its own glyph, so states differ in shape and not only in color. \
Labels are neutral, with a glyph for their group.

The UI now has a light theme, and a second dark theme, Dim, which uses Omni's original blue-grey colors. The theme menu at the right end of the top \
bar offers Light, Dark, Dim and System. System is the default and follows the operating system.

Config history and pending updates use a new diff view with split and inline modes. Code blocks have syntax highlighting.
"""

[notes.frontend-qol]
title = "UI Improvements"
description = """\
The UI marks the Talos versions served from an enterprise image factory. The enterprise label is also shown on the cluster overview and in the Talos \
update, upgrade and install dialogs.

The cluster security page now says why scans are not available: either the cluster does not run enterprise images, or the factory has no scan report \
for its schematic yet. Installation media downloads show a loading state, and a message when the enterprise factory does not support the selected \
Talos version.

Every page has its own browser tab title, e.g., "Overview · my-cluster · Clusters · Omni". The version selectors group Talos versions by minor \
version. Users with no avatar from the identity provider get one generated from their name or email.
"""