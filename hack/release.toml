# commit to be tagged for the new release
commit = "HEAD"

project_name = "Omni"
github_repo = "siderolabs/omni"
match_deps = "^github.com/((talos-systems|siderolabs)/[a-zA-Z0-9-]+)$"

pre_release = true
previous = "v1.13.0"

[notes.aaa-removed-deprecated-options]
title = "Urgent Upgrade Notes **(No, really, you MUST read this before you upgrade)**"
description = """\
The BoltDB storage backend (`storage.default.kind: boltdb`, `--storage-kind boltdb`) is still deprecated and will be removed \
in a future release. There is no automated migration between the two backends, so if your Omni runs on BoltDB, plan the move \
to etcd, which is the default.

The following deprecated flags and config keys are removed. Omni does not start when it gets one of them, so switch to the \
replacement before the upgrade:

- `--siderolink-api-bind-addr`, `--siderolink-api-cert`, `--siderolink-api-key` and `--siderolink-api-advertised-url`: use \
`--machine-api-bind-addr`, `--machine-api-cert`, `--machine-api-key` and `--machine-api-advertised-url`.
- `--embedded-discovery-service-endpoint`: use `--embedded-discovery-service-port`.
- `--debug`: use `--log-level debug`.
- `registries.imageFactoryBaseURL`, `registries.imageFactoryPXEBaseURL`, `registries.imageFactoryUsername` and \
`registries.imageFactoryPassword`, with the flags `--image-factory-address`, `--image-factory-pxe-address`, \
`--image-factory-username` and `--image-factory-password`: use `registries.factories.primary` (`--primary-factory-url`, \
`--primary-factory-pxe-url`, `--primary-factory-username` and `OMNI_PRIMARY_FACTORY_PASSWORD`).
- `auth.auth0.initialUsers`: use `auth.initialUsers` (`--initial-users`).

The `OMNI_IMAGE_FACTORY_USERNAME` and `OMNI_IMAGE_FACTORY_PASSWORD` environment variables are removed too. Omni ignores \
them now, so set `OMNI_PRIMARY_FACTORY_USERNAME` and `OMNI_PRIMARY_FACTORY_PASSWORD` instead, or the image factory credentials \
are missing.

Cluster templates now have a `locked` field on the `Cluster` document, and `omnictl cluster template export` writes it for \
locked clusters. The cluster template is the source of truth for the cluster lock.

Syncing a template without `locked: true` unlocks the cluster, even when it was locked in the UI or with \
`omnictl cluster lock`. Previously, a sync that also added or removed machines was rejected by Omni, because the machines \
were changed before the cluster was unlocked. Now the unlock is applied first, so these changes go through. Add \
`locked: true` to the templates of the locked clusters before you sync them.

`omnictl cluster template sync` now fails before it changes anything when a template with `locked: true` changes the \
cluster, its machine sets or its machine set nodes. Previously, such a sync failed halfway and left part of the changes \
applied. A cluster cannot be created from a template with `locked: true`, sync it without the lock first.
"""

[notes.omnictl-download-removal]
title = "`omnictl download` Removal"
description = """\
The deprecated `omnictl download` command is removed. Use `omnictl media download` with an installation media preset \
instead, for example `omnictl media preset create iso-amd64 --arch amd64` and then `omnictl media download iso-amd64`.
"""

[notes.identity-label-rules]
title = "Identity Label Rules"
description = """\
`SAMLLabelRule` resources are replaced by `IdentityLabelRule` resources (`IdentityLabelRules.omni.sidero.dev`), as the rules assign roles \
from the labels of both SAML and OIDC logins. Omni migrates the existing rules on startup and keeps their IDs. `SAMLLabelRules` can no \
longer be read or written, so manifests and scripts that use them need to switch to the new type.

The deprecated `assignroleonregistration` field is removed. The migration moves its value to `assignrole` on the rules that still use it.
"""
