syntax = "proto3";
package imagefactory;

option go_package = "github.com/siderolabs/omni/client/api/omni/imagefactory";

// Arch is the machine architecture an artifact is built for.
enum Arch {
  UNKNOWN_ARCH = 0;
  AMD64 = 1;
  ARM64 = 2;
}

// VulnerabilityReportFormat selects the format a vulnerability scan report is served in. The
// factory publishes the same scan under each of these.
enum VulnerabilityReportFormat {
  UNKNOWN_FORMAT = 0;
  // Grype's native JSON report.
  JSON = 1;
  // SARIF, as consumed by code scanning tools.
  SARIF = 2;
  // CycloneDX VEX.
  CYCLONEDX = 3;
  // The human-readable table Grype prints.
  TABLE = 4;
}

message VulnerabilityReportRequest {
  // SchematicID is the hex-encoded SHA-256 of the schematic the report covers.
  string schematic_id = 1;
  // TalosVersion is the Talos version the schematic was built for.
  string talos_version = 2;
  // Arch is the architecture the schematic was built for.
  Arch arch = 3;
  // Format is the format to serve the report in.
  VulnerabilityReportFormat format = 4;
}

message VulnerabilityReportResponse {
  // Data is the report, in the requested format.
  bytes data = 1;
}

message SBOMRequest {
  // SchematicID is the hex-encoded SHA-256 of the schematic the SBOM covers.
  string schematic_id = 1;
  // TalosVersion is the Talos version the schematic was built for.
  string talos_version = 2;
  // Arch is the architecture the schematic was built for.
  Arch arch = 3;
}

message SBOMResponse {
  // Data is the SPDX bundle, as JSON.
  bytes data = 1;
}

message VEXDocumentRequest {
  // TalosVersion is the Talos version the document covers.
  string talos_version = 1;
}

message VEXDocumentResponse {
  // Data is the OpenVEX document, as JSON.
  bytes data = 1;
}

message DownloadTokenRequest {
  // FactoryURL is the URL the factory to issue a token for.
  string factory_url = 1;
  // Duration is the TTL in seconds for the token.
  int32 duration = 2;
}

message DownloadTokenResponse {
  // Token is the download token.
  string token = 1;
}

message ClusterArtifactTargetsRequest {
  // ClusterID is the cluster to resolve artifact targets for.
  string cluster_id = 1;
}

// ArtifactTarget is a (schematic, arch) pair to fetch security artifacts for, installed on some
// subset of the cluster's machines.
message ArtifactTarget {
  // SchematicID is the hex-encoded SHA-256 of the schematic installed on the target's machines.
  string schematic_id = 1;
  // Arch is the architecture of the target's machines.
  Arch arch = 2;
  // MachineCount is the number of cluster machines on this schematic and architecture.
  int32 machine_count = 3;
  // IncludesControlPlane is set when at least one of the target's machines is a control plane node.
  bool includes_control_plane = 4;
}

message ClusterArtifactTargetsResponse {
  // Targets are the unique (schematic, arch) pairs installed across the cluster's machines.
  repeated ArtifactTarget targets = 1;
  // CurrentTalosVersion is the Talos version the cluster is currently running.
  string current_talos_version = 2;
  // UpgradeTargetVersions are the Talos versions the security views scan against in addition to
  // the current version: the latest patch of the current minor, and the latest patch of the next
  // minor, when strictly newer than the current version.
  repeated string upgrade_target_versions = 3;
}

// ImageFactoryService serves the image factory artifacts Omni proxies on the caller's behalf, so
// the frontend never talks to the image factory directly.
service ImageFactoryService {
  // VulnerabilityReport returns the vulnerability scan report of a schematic.
  rpc VulnerabilityReport(VulnerabilityReportRequest) returns (VulnerabilityReportResponse);

  // SBOM returns the SPDX bundle of a schematic.
  rpc SBOM(SBOMRequest) returns (SBOMResponse);

  // VEXDocument returns the VEX document of a Talos version.
  rpc VEXDocument(VEXDocumentRequest) returns (VEXDocumentResponse);

  // DownloadToken returns a token to download images with.
  rpc DownloadToken(DownloadTokenRequest) returns (DownloadTokenResponse);

  // ClusterArtifactTargets resolves the (schematic, arch) pairs installed across a cluster's
  // machines, along with the Talos versions to fetch security artifacts for.
  rpc ClusterArtifactTargets(ClusterArtifactTargetsRequest) returns (ClusterArtifactTargetsResponse);
}
