syntax = "proto3";
package management;

option go_package = "github.com/siderolabs/omni/client/api/omni/management";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "common/common.proto";

message KubeconfigResponse {
  // Kubeconfig is the kubeconfig for the cluster.
  bytes kubeconfig = 1;
}

message TalosconfigResponse {
  // talosconfig is the talos client configuration to access the cluster via the proxy.
  bytes talosconfig = 1;
}

message OmniconfigResponse {
  // omniconfig is the omnictl client configuration to access the omni instance.
  bytes omniconfig = 1;
}

message MachineLogsRequest {
  // MachineId is the ID of the machine.
  string machine_id = 1;
  // Follow is whether to follow the logs.
  bool follow = 2;
  // TailLines is the number of lines to tail.
  int32 tail_lines = 3;
}

message ValidateConfigRequest {
  // Config represents raw configuration string to validate.
  string config = 1;
}

message TalosconfigRequest {
  // Raw indicates whether to generate an raw talosconfig or a regular one.
  bool raw = 1;
  // BreakGlass indicates whether to generate an operator break glass talosconfig or a regular one.
  bool break_glass = 2;
}

message CreateServiceAccountRequest {
  string armored_pgp_public_key = 1;
  reserved 2;
  // UseUserRole indicates whether to use the role of the creating user.
  // When true, role will be ignored and the service account will be created with the role of the creating user.
  bool use_user_role = 3;
  string role = 4;
  string name = 5;
}

message CreateServiceAccountResponse {
  string public_key_id = 1;
}

message RenewServiceAccountRequest {
  string name = 1;
  string armored_pgp_public_key = 2;
}

message RenewServiceAccountResponse {
  string public_key_id = 1;
}

message DestroyServiceAccountRequest {
  string name = 1;
}

message ListServiceAccountsResponse {
  message ServiceAccount {
    message PgpPublicKey {
      string id = 1;
      string armored = 2;
      google.protobuf.Timestamp expiration = 3;
      google.protobuf.Timestamp created = 4;
      google.protobuf.Timestamp last_used = 5;
    }

    string name = 1;
    repeated PgpPublicKey pgp_public_keys = 2;
    reserved 3;
    string role = 4;
    string last_active = 5;
  }

  repeated ServiceAccount service_accounts = 1;
}

message KubeconfigRequest {
  bool service_account = 1;
  google.protobuf.Duration service_account_ttl = 2;
  string service_account_user = 3;
  repeated string service_account_groups = 4;
  string grant_type = 5;
  bool break_glass = 6;
  string oidc_cache_base_dir = 7;
  bool oidc_cache_isolation = 8;
}

message KubernetesUpgradePreChecksRequest {
  string new_version = 1;
}

message KubernetesUpgradePreChecksResponse {
  bool ok = 1;
  string reason = 2;
}

message KubernetesSSAOptions {
  enum InventoryPolicy {
    MUST_MATCH = 0;
    ADOPT_IF_NO_INVENTORY = 1;
    ADOPT_ALL = 2;
  };

  InventoryPolicy inventory_policy = 1;
  google.protobuf.Duration reconcile_timeout = 2;
  bool force_conflicts = 3;
  bool no_prune = 4;
}

message KubernetesSyncManifestRequest {
  bool dry_run = 1;
  KubernetesSSAOptions ssa = 2;
}

message KubernetesSyncManifestResponse {
  enum ResponseType {
    UNKNOWN = 0;
    MANIFEST = 1;
    ROLLOUT = 2;
  };

  ResponseType response_type = 1;
  string path = 2;
  bytes object = 3;
  string diff = 4;
  bool skipped = 5;
}

enum SchematicBootloader {
  BOOT_AUTO = 0;
  BOOT_DUAL = 1;
  BOOT_SD = 2;
  BOOT_GRUB = 3;
}

message CreateSchematicRequest {
  message Overlay {
    string image = 1;
    string name = 2;
    string options = 3;
  }

  enum SiderolinkGRPCTunnelMode {
    AUTO = 0;
    DISABLED = 1;
    ENABLED = 2;
  }

  repeated string extensions = 1;
  repeated string extra_kernel_args = 2;
  map<uint32, string> meta_values = 3;
  string talos_version = 4;
  string media_id = 5;
  reserved 6;
  SiderolinkGRPCTunnelMode siderolink_grpc_tunnel_mode = 7;
  string join_token = 8;
  Overlay overlay = 9;
  SchematicBootloader bootloader = 10;
  string embedded_machine_config = 11;
  string image_factory_url = 12;
}

message CreateSchematicFromRawRequest {
  bytes raw_schematic = 1;
  string talos_version = 2;
}

message CreateSchematicResponse {
  string schematic_id = 1;
  string pxe_url = 2;
  bool grpc_tunnel_enabled = 3;
  string schematic_yml = 4;
}

message InstallationMediaURLRequest {
  // InstallationMediaKind is one of the kinds the image factory serves. The comments show the shape of
  // the filename the factory serves each kind under, which Omni assembles from the fields below.
  enum InstallationMediaKind {
    INSTALLATION_MEDIA_KIND_UNSET = 0;
    // <platform>-<arch>[-secureboot], served from the factory's PXE endpoint.
    INSTALLATION_MEDIA_KIND_PXE = 1;
    // <platform>-<arch>[-secureboot].iso
    INSTALLATION_MEDIA_KIND_ISO = 2;
    // <platform>-<arch>[-secureboot].<format>
    INSTALLATION_MEDIA_KIND_DISK = 3;
  }

  // TalosVersion selects the image factory the same way the media URLs do.
  string talos_version = 1;
  // SchematicId is the ID the image factory returned for a schematic, e.g. from CreateSchematicFromRaw.
  string schematic_id = 2;
  // StandaloneUrl makes Omni return a URL containing everything needed, e.g. the credentials or token
  // in the URL itself, instead of returning them in the headers.
  //
  // Such a URL is as sensitive as the credentials it carries. Anything it is written into, like an
  // iPXE script or a task log, exposes them to whoever can read it.
  //
  // When this is set, Headers on the response will be empty. It is implied for the PXE kind, which is
  // fetched by firmware that cannot send headers.
  //
  // Leaving it unset does not promise headers: a factory that authenticates downloads with a token puts it
  // in the URL for every caller. Send Headers whenever it is not empty, instead of deciding from this field.
  bool standalone_url = 3;
  InstallationMediaKind installation_media_kind = 4;

  // Platform, Architecture, Format and SecureBoot identify which medium is wanted. Omni assembles the
  // image factory filename out of them, so callers never encode the naming convention themselves.
  //
  // Platform is the Talos platform, e.g. "metal" or "nocloud".
  string platform = 5;
  string architecture = 6;
  // Format is the disk image format of the disk kind, e.g. "raw.xz" or "qcow2.gz", and unused by every
  // other kind, whose format the kind itself implies.
  string format = 7;
  bool secure_boot = 8;

  // DownloadTokenTtl is how long the caller needs the URL to keep working, for a factory that
  // authenticates downloads with a token. Unset takes Omni's default, which suits a fetch performed right
  // away. Ask for more when something else performs it later, such as a hypervisor import queue.
  //
  // The factory refuses a lifetime outside its configured bounds, which comes back as InvalidArgument.
  // Ignored by a factory that authenticates downloads with credentials instead.
  google.protobuf.Duration download_token_ttl = 9;
}

message InstallationMediaURLResponse {
  string url = 1;
  // Headers must be sent with the request fetching the URL. Empty when the image factory needs no
  // authentication, or when it travels inside the URL instead.
  map<string, string> headers = 2;
  // ImageFactoryHost is the same host as in the URL. Purely informative: to fetch the medium, only the
  // URL and the headers should be used.
  string image_factory_host = 3;
  // StorageKey identifies the medium the URL points at, for callers that store what they download. It
  // changes only when the medium itself does, so it is stable across credential rotation, unlike the URL,
  // which can carry credentials or a token.
  //
  // Treat it as opaque. Omni may change how it is derived, which costs a caller one re-download of the
  // media it already holds.
  string storage_key = 4;

  // ExpiresAt is when the URL stops working, for a caller that does not perform the fetch itself, such as
  // one handing the URL to a hypervisor download API. Unset when the URL does not expire.
  //
  // It is Omni's estimate rather than a guarantee, so treat it as the earliest moment the URL may stop
  // working.
  google.protobuf.Timestamp expires_at = 5;
}

message GetSupportBundleRequest {
  string cluster = 1;

  // Encrypt the bundle with age, to public SSH keys of the public members of the siderolabs GitHub organization.
  //
  // Opt-in, so that clients which predate encryption keep receiving a plain zip.
  bool encrypt = 2;
  // Extra recipients: SSH public keys (ssh-rsa, ssh-ed25519) or "age1..." recipients.
  repeated string encryption_recipients = 3;
  // Encrypt only to encryption_recipients, skipping the built-in Sidero Labs ones.
  bool encryption_no_default_recipients = 4;
}

message GetSupportBundleResponse {
  message Progress {
    string source = 1;
    string error = 2;
    string state = 3;
    int32 total = 4;
    int32 value = 5;
  }

  Progress progress = 1;
  bytes bundle_data = 2;
  // Who can decrypt the bundle, sent once before collection starts. Empty when not encrypting.
  repeated string encryption_recipients = 3;
}

enum AuditLogEventType {
  AUDIT_LOG_EVENT_TYPE_UNSPECIFIED = 0;
  AUDIT_LOG_EVENT_TYPE_CREATE = 1;
  AUDIT_LOG_EVENT_TYPE_UPDATE = 2;
  AUDIT_LOG_EVENT_TYPE_UPDATE_WITH_CONFLICTS = 3;
  AUDIT_LOG_EVENT_TYPE_DESTROY = 4;
  AUDIT_LOG_EVENT_TYPE_TEARDOWN = 5;
  AUDIT_LOG_EVENT_TYPE_TALOS_ACCESS = 6;
  AUDIT_LOG_EVENT_TYPE_K8S_ACCESS = 7;
  AUDIT_LOG_EVENT_TYPE_AUDIT_LOG_ACCESS = 8;
}

enum AuditLogOrderByField {
  AUDIT_LOG_ORDER_BY_FIELD_UNSPECIFIED = 0;
  AUDIT_LOG_ORDER_BY_FIELD_DATE = 1;
  AUDIT_LOG_ORDER_BY_FIELD_EVENT_TYPE = 2;
  AUDIT_LOG_ORDER_BY_FIELD_RESOURCE_TYPE = 3;
  AUDIT_LOG_ORDER_BY_FIELD_RESOURCE_ID = 4;
  AUDIT_LOG_ORDER_BY_FIELD_CLUSTER_ID = 5;
  AUDIT_LOG_ORDER_BY_FIELD_ACTOR = 6;
}

enum AuditLogOrderByDir {
  AUDIT_LOG_ORDER_BY_DIR_UNSPECIFIED = 0;
  AUDIT_LOG_ORDER_BY_DIR_ASC = 1;
  AUDIT_LOG_ORDER_BY_DIR_DESC = 2;
}

// specifies start and end time (inclusive range) in <year>-<month>-<day> format. We pass time as string to avoid timezone issues.
message ReadAuditLogRequest {
  string start_time = 1;
  string end_time = 2;
  AuditLogOrderByField order_by_field = 3;
  AuditLogOrderByDir order_by_dir = 4;
  string search = 5;
  AuditLogEventType event_type = 6;
  string resource_type = 7;
  string resource_id = 8;
  string cluster_id = 9;
  string actor = 10;
  // Follow keeps the stream open after the backlog is drained, delivering new events as they are written.
  //
  // Events are delivered in insertion order. No ordering, search, filter or time-range fields may be
  // combined with follow, except StartTsMs. The server acknowledges follow support with an initial
  // response carrying an empty audit_log, and ends the stream cleanly after a bounded duration:
  // reconnect to keep following.
  bool follow = 11;
  // StartTsMs is the inclusive start position in Unix milliseconds, matched against the event timestamps.
  //
  // Zero means unset. When set, it takes precedence over StartTime. When unset in follow mode, the
  // stream starts at the current tail, delivering only events written after the stream was established.
  // To read everything retained, pass 1.
  int64 start_ts_ms = 12;
  // FromId is the inclusive follow start position by event id, as delivered in the follow responses.
  //
  // Zero means unset. When set, it takes precedence over the timestamp fields, and the resume is
  // exact. Only usable with follow, and only with ids obtained from the same server: following an
  // id position the server no longer knows fails the stream.
  int64 from_id = 13;
}

message ReadAuditLogResponse {
  bytes audit_log = 1;
  // Id is the id of the event in AuditLog, populated on follow streams. Following from FromId set to
  // an id plus one resumes exactly after that event.
  //
  // Every follow stream starts with an acknowledgment response carrying an empty AuditLog, whose id is
  // the resolved start position: the id just before the first event the stream will deliver.
  int64 id = 2;
}

message ValidateJsonSchemaRequest {
  string data = 1;
  string schema = 2;
}

message ValidateJsonSchemaResponse {
  message Error {
    repeated Error errors = 1;

    string schema_path = 2;
    string data_path = 3;
    string cause = 4;
  }

  repeated Error errors = 1;
}

message MaintenanceUpgradeRequest {
  string machine_id = 1;
  string version = 2;
}

message MaintenanceUpgradeResponse {
}

message MaintenanceLifecycleRequest {
  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    // OPERATION_INSTALL writes Talos to a fresh disk on a machine with no on-disk Talos installed yet.
    OPERATION_INSTALL = 1;
    // OPERATION_UPGRADE replaces the existing on-disk Talos on a machine in maintenance mode.
    OPERATION_UPGRADE = 2;
  }

  string machine_id = 1;
  Operation operation = 2;
  // version is the Talos version to install/upgrade to.
  string version = 3;
  // disk is the target install disk (e.g. "/dev/sda"). Required for OPERATION_INSTALL; must be empty
  // for OPERATION_UPGRADE (the existing system disk is reused).
  string disk = 4;
}

message MaintenanceLifecycleResponse {
  // message indicates the current progress of the installation or upgrade.
  string message = 1;
}

message GetMachineJoinConfigRequest {
  bool use_grpc_tunnel = 1;
  string join_token = 2;
}

message GetMachineJoinConfigResponse {
  repeated string kernel_args = 1;
  string config = 2;
}

message GenJoinTokenResponse {
  string token = 1;
}

message CreateJoinTokenRequest {
  string name = 1;
  google.protobuf.Timestamp expiration_time = 2;
}

message CreateJoinTokenResponse {
  string id = 1;
}

message ResetNodeUniqueTokenRequest {
  string id = 1;
}

message ResetNodeUniqueTokenResponse {}

message CreateUserRequest {
  string email = 1;
  string role = 2;
}

message CreateUserResponse {
  string user_id = 1;
}

message UpdateUserRequest {
  string email = 1;
  string role = 2;
}

message DestroyUserRequest {
  string email = 1;
}

message MachinePowerOffRequest {
  // MachineId is the ID of the machine to power off (shutdown).
  string machine_id = 1;
}

message MachinePowerOffResponse {}

message MachinePowerOnRequest {
  // MachineId is the ID of the machine to power on.
  string machine_id = 1;
}

message MachinePowerOnResponse {}

message ListUsersResponse {
  message User {
    string id = 1;
    string email = 2;
    string role = 3;
    map<string, string> saml_labels = 4;
    string last_active = 5;
  }

  repeated User users = 1;
}

service ManagementService {
  rpc Kubeconfig(KubeconfigRequest) returns (KubeconfigResponse);
  rpc Talosconfig(TalosconfigRequest) returns (TalosconfigResponse);
  rpc Omniconfig(google.protobuf.Empty) returns (OmniconfigResponse);
  rpc MachineLogs(MachineLogsRequest) returns (stream common.Data);
  rpc ValidateConfig(ValidateConfigRequest) returns (google.protobuf.Empty);
  rpc ValidateJSONSchema(ValidateJsonSchemaRequest) returns (ValidateJsonSchemaResponse);
  rpc CreateServiceAccount(CreateServiceAccountRequest) returns (CreateServiceAccountResponse);
  rpc RenewServiceAccount(RenewServiceAccountRequest) returns (RenewServiceAccountResponse);
  rpc ListServiceAccounts(google.protobuf.Empty) returns (ListServiceAccountsResponse);
  rpc DestroyServiceAccount(DestroyServiceAccountRequest) returns (google.protobuf.Empty);
  rpc KubernetesUpgradePreChecks(KubernetesUpgradePreChecksRequest) returns (KubernetesUpgradePreChecksResponse);
  rpc KubernetesSyncManifests(KubernetesSyncManifestRequest) returns (stream KubernetesSyncManifestResponse);
  rpc CreateSchematic(CreateSchematicRequest) returns (CreateSchematicResponse);
  rpc CreateSchematicFromRaw(CreateSchematicFromRawRequest) returns (CreateSchematicResponse);
  rpc GetInstallationMediaURL(InstallationMediaURLRequest) returns (InstallationMediaURLResponse);
  rpc GetSupportBundle(GetSupportBundleRequest) returns (stream GetSupportBundleResponse);
  rpc ReadAuditLog(ReadAuditLogRequest) returns (stream ReadAuditLogResponse);
  rpc MaintenanceUpgrade(MaintenanceUpgradeRequest) returns (MaintenanceUpgradeResponse);
  rpc MaintenanceLifecycle(MaintenanceLifecycleRequest) returns (stream MaintenanceLifecycleResponse);
  rpc GetMachineJoinConfig(GetMachineJoinConfigRequest) returns (GetMachineJoinConfigResponse);
  rpc CreateJoinToken(CreateJoinTokenRequest) returns (CreateJoinTokenResponse);
  rpc ResetNodeUniqueToken(ResetNodeUniqueTokenRequest) returns (ResetNodeUniqueTokenResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc ListUsers(google.protobuf.Empty) returns (ListUsersResponse);
  rpc UpdateUser(UpdateUserRequest) returns (google.protobuf.Empty);
  rpc DestroyUser(DestroyUserRequest) returns (google.protobuf.Empty);
  rpc MachinePowerOff(MachinePowerOffRequest) returns (MachinePowerOffResponse);
  rpc MachinePowerOn(MachinePowerOnRequest) returns (MachinePowerOnResponse);
}
