<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="csp-nonce" content="{{.Nonce}}" />
    <title>Omni</title>
    <script nonce="{{.Nonce}}">
      // Sets the theme before first paint, so a light-mode machine never flashes
      // dark while the app loads. Reads the same key as src/methods/theme.ts.
      ;(function () {
        var preference = 'system'
        try {
          preference = localStorage.getItem('theme') || 'system'
        } catch (e) {}
        var theme =
          preference === 'light' || preference === 'dark' || preference === 'dim'
            ? preference
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.style.colorScheme = theme === 'light' ? 'light' : 'dark'
      })()
    </script>
  </head>
  <body>
    <noscript>
      <strong>
        We're sorry but Omni UI doesn't work properly without JavaScript enabled. Please enable it
        to continue.
      </strong>
    </noscript>
    <div id="app">
      <div class="flex h-screen flex-col items-center justify-center">
        <span class="animate-pulse delay-3000" style="opacity: 0">Loading Omni ...</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
